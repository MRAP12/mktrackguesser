<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="images_mkwd/favicon.png" />
  <title>Guess the Mario Kart World track!</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gap-xs: 0.5rem;
      --gap-sm: 0.75rem;
      --gap: 1rem;
      --gap-lg: 1.5rem;
      --text: #ffffff;
      --bg-overlay: rgba(0,0,0,0.55);
      --panel: rgba(0,0,0,0.4);
      --shadow: #0006;
      --radius: 12px;
      --tap-size: 44px;
    }

    /* Base: mobile-first */
    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: var(--gap);
      color: var(--text);
      font-family: 'Lexend', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align: center;
      background: url('images_mkwd/background.png') center/cover no-repeat fixed;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: var(--gap);
    }

    /* Safer contrast on busy background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.65));
      pointer-events: none;
      z-index: -1;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--bg-overlay);
      backdrop-filter: saturate(120%) blur(6px);
      -webkit-backdrop-filter: saturate(120%) blur(6px);
      border-radius: 999px;
      margin-inline: auto;
      padding: var(--gap-sm) var(--gap);
      max-width: min(100%, 1000px);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--gap);
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      line-height: 1;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      text-shadow: 1px 1px 2px #000;
      padding: 0.35rem 0.25rem;
      border-bottom: 2px solid transparent;
      outline-offset: 4px;
    }

    nav a.active,
    nav a:focus-visible,
    nav a:hover {
      border-bottom-color: var(--text);
    }

    main {
      margin-inline: auto;
      width: 100%;
      max-width: 1000px;
      display: grid;
      place-items: center;
      gap: var(--gap-lg);
    }

    h1 {
      margin: 0.25rem 0 0;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      line-height: 1.15;
      text-shadow: 2px 2px 4px #000;
    }

    .card {
      width: min(100%, 720px);
      background: var(--panel);
      padding: var(--gap-lg);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px var(--shadow);
      display: grid;
      gap: var(--gap);
    }

    .media {
      display: grid;
      justify-items: center;
      gap: var(--gap);
    }

    #track-img {
      display: block;
      width: 100%;
      max-width: 520px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 2px 12px var(--shadow);
      background: #222;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
      justify-items: center;
    }

    .controls-inline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--gap);
      width: min(100%, 520px);
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    input[type="text"], button {
      background: rgba(0,0,0,0.5);
      color: var(--text);
      border: 1px solid #fff;
      border-radius: 8px;
      font-size: 1rem;
      line-height: 1.2;
      min-height: var(--tap-size);
    }

    input[type="text"] {
      padding: 0.75rem 0.85rem;
      width: 100%;
    }

    button {
      padding: 0.75rem 1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    #submit-btn {
      background: rgba(0, 128, 255, 0.5);
      border-color: #e6f3ff;
    }

    #play-again-btn {
      display: none;
      background: rgba(0, 128, 0, 0.5);
      border-color: #eaffea;
    }

    #result {
      min-height: 1.6em;
      font-size: 1.05rem;
      text-shadow: 1px 1px 2px #000;
    }

    .history {
      width: min(100%, 720px);
      background: var(--panel);
      padding: var(--gap-lg);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px var(--shadow);
      text-align: left;
    }

    .history h3 {
      margin: 0 0 var(--gap-sm);
      font-size: 1.1rem;
    }

    #history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.35rem;
    }

    #history-list li {
      font-size: 1rem;
    }

    .correct { color: lightgreen; }
    .wrong { color: salmon; }

    #credit {
      position: fixed;
      right: 10px;
      bottom: 10px;
      font-size: clamp(1rem, 3.2vw, 1.5rem);
      text-shadow: 1px 1px 2px #000;
      user-select: none;
      pointer-events: none;
    }

    /* Wider screens */
    @media (min-width: 600px) {
      .controls-inline {
        grid-template-columns: 1fr auto;
      }
    }

    @media (min-width: 900px) {
      .card {
        grid-template-columns: 1fr;
      }
      nav { gap: 2rem; }
    }

    /* Prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      body::before { background: rgba(0,0,0,0.5); }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Primary">
      <a href="index.html">Main</a>
      <a href="mk8deluxe.html">Mario Kart 8 Deluxe</a>
      <a href="info.html">Update Plans</a>
      <a href="mkwd.html" class="active" aria-current="page">Mario Kart World</a>
    </nav>
  </header>

  <main>
    <h1>Guess the Mario Kart World Track!</h1>

    <section class="card" aria-labelledby="game-title">
      <div class="media">
        <img id="track-img" src="images_mkwd/mkwd_0001.png" alt="Track outline to guess" />
      </div>

      <div class="controls" role="form" aria-label="Guess controls">
        <div class="controls-inline">
          <label for="guess">Track name</label>
          <input
            type="text"
            id="guess"
            placeholder="Enter your guess..."
            list="track-list"
            autocomplete="on"
            inputmode="text"
          />
          <button id="submit-btn" type="button" onclick="submitGuess()">Submit</button>
        </div>

        <datalist id="track-list"></datalist>

        <p id="result" role="status" aria-live="polite"></p>
          <button type="button" onclick="submitGuess()">Submit</button>
  <p id="result"></p>
  <button type="button" id="play-again-btn" onclick="resetGame()">🔁 Play Again</button>
      </div>
    </section>

    <section class="history" aria-labelledby="history-title">
      <h3 id="history-title">Guesses</h3>
      <ul id="history-list"></ul>
    </section>
  </main>

  <div id="credit">By MRAP12</div>

  <script>
    // Deluxe track list
    const validTracks = [
      "Mario Bros Circuit", "Crown City", "Whistlestop Summit", "DK Spaceport",
      "Desert Hills", "Shy Guy Bazaar", "Wario Stadium", "Airship Fortress",
      "DK Pass", "Starview Peak", "Sky-High Sundae", "Wario Shipyard",
      "Koopa Troopa Beach", "Faraway Oasis", "Crown City", "Peach Stadium",
      "Peach Beach", "Salty Salty Speedway", "Dino Dino Jungle", "Great ? Block Ruins",
      "Cheep Cheep Falls", "Dandelion Depths", "Boo Cinema", "Dry Bones Burnout",
      "Moo Moo Meadows", "Choco Mountain", "Toad's Factory",
      "Bowser's Castle", "Acorn Heights", "Mario Circuit",
      "Peach Stadium", "Rainbow Road"
    ];

    // Track mapping by number
    const trackImages = [
      { name: "Mario Bros Circuit", img: "mkwd_0001.png" },
      { name: "Crown City", img: "mkwd_0002.png" },
      { name: "Whistlestop Summit", img: "mkwd_0003.png" },
      { name: "DK Spaceport", img: "mkwd_0004.png" },
      { name: "Desert Hills", img: "mkwd_0005.png" },
      { name: "Shy Guy Bazaar", img: "mkwd_0006.png" },
      { name: "Wario Stadium", img: "mkwd_0007.png" },
      { name: "Airship Fortress", img: "mkwd_0008.png" },
      { name: "DK Pass", img: "mkwd_0009.png" },
      { name: "Starview Peak", img: "mkwd_0010.png" },
      { name: "Sky-High Sundae", img: "mkwd_0011.png" },
      { name: "Wario Shipyard", img: "mkwd_0012.png" },
      { name: "Koopa Troopa Beach", img: "mkwd_0013.png" },
      { name: "Faraway Oasis", img: "mkwd_0014.png" },
      { name: "Crown City", img: "mkwd_0015.png" },
      { name: "Peach Stadium", img: "mkwd_0016.png" },
      { name: "Peach Beach", img: "mkwd_0017.png" },
      { name: "Salty Salty Speedway", img: "mkwd_0018.png" },
      { name: "Dino Dino Jungle", img: "mkwd_0019.png" },
      { name: "Great ? Block Ruins", img: "mkwd_0020.png" },
      { name: "Cheep Cheep Falls", img: "mkwd_0021.png" },
      { name: "Dandelion Depths", img: "mkwd_0022.png" },
      { name: "Boo Cinema", img: "mkwd_0023.png" },
      { name: "Dry Bones Burnout", img: "mkwd_0024.png" },
      { name: "Moo Moo Meadows", img: "mkwd_0025.png" },
      { name: "Choco Mountain", img: "mkwd_0026.png" },
      { name: "Toad's Factory", img: "mkwd_0027.png" },
      { name: "Bowser's Castle", img: "mkwd_0028.png" },
      { name: "Acorn Heights", img: "mkwd_0029.png" },
      { name: "Mario Circuit", img: "mkwd_0030.png" },
      { name: "Peach Stadium", img: "mkwd_0031.png" },
      { name: "Rainbow Road", img: "mkwd_0032.png" }
    ];

    let answerIndex = Math.floor(Math.random() * trackImages.length);
    let answer = trackImages[answerIndex].name;
    let guessCount = 0;
    const MAX_GUESSES = 6;
    const STORAGE_KEY = 'mkwdGuesses';

    document.addEventListener('DOMContentLoaded', () => {
      const imgEl = document.getElementById('track-img');
      imgEl.src = 'images_mkwd/' + trackImages[answerIndex].img;
      populateDatalist();
      loadHistory();

      // Submit on Enter for faster play
      const input = document.getElementById('guess');
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitGuess();
        }
      });
    });

    function populateDatalist() {
      const dl = document.getElementById('track-list');
      dl.innerHTML = '';
      validTracks.forEach(track => {
        const opt = document.createElement('option');
        opt.value = track;
        dl.appendChild(opt);
      });
    }

    function submitGuess() {
      if (guessCount >= MAX_GUESSES) {
        alert("❌ You've reached the maximum number of guesses!");
        return;
      }

      const input = document.getElementById('guess');
      const guess = input.value.trim();
      if (!validTracks.includes(guess)) {
        alert("❌ Invalid track name. Please choose a valid Mario Kart World track.");
        return;
      }

      const isCorrect = guess === answer;
      document.getElementById('result').innerText = isCorrect
        ? "✅ Correct! It's " + answer
        : "❌ Wrong guess. Try again!";

      guessCount++;
      addToHistory(guess, isCorrect);

      if (isCorrect || guessCount >= MAX_GUESSES) {
        document.getElementById('play-again-btn').style.display = 'inline-block';
      }

      input.value = '';
      input.focus();
    }

    function addToHistory(guess, isCorrect) {
      const list = document.getElementById('history-list');
      const li = document.createElement('li');
      li.textContent = `Guess ${guessCount}: ${guess} ${isCorrect ? '✅' : '❌'}`;
      li.className = isCorrect ? 'correct' : 'wrong';
      list.appendChild(li);

      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      stored.push({ guess, correct: isCorrect, number: guessCount });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
    }

    function loadHistory() {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      stored.forEach(entry => {
        const li = document.createElement('li');
        li.textContent = `Guess ${entry.number}: ${entry.guess} ${entry.correct ? '✅' : '❌'}`;
        li.className = entry.correct ? 'correct' : 'wrong';
        list.appendChild(li);
      });
      guessCount = stored.length;
    }

    function resetGame() {
      answerIndex = Math.floor(Math.random() * trackImages.length);
      answer = trackImages[answerIndex].name;
      document.getElementById('track-img').src = 'images_mkwd/' + trackImages[answerIndex].img;
      guessCount = 0;
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('history-list').innerHTML = '';
      document.getElementById('result').innerText = '';
      document.getElementById('play-again-btn').style.display = 'none';
      document.getElementById('guess').value = '';
      document.getElementById('guess').focus();
    }
  </script>
</body>
</html>
