<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="images_mkwd/favicon.png">
  <title>Guess the Mario Kart World track!</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 40px;
      text-align: center;
      font-family: 'Lexend', sans-serif;
      color: white;
      background: url('images_mkwd/background.png') center/cover no-repeat;
    }

    h1 {
      text-shadow: 2px 2px 4px #000;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.6);
      padding: 15px 0;
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      padding-bottom: 5px;
      border-bottom: 2px solid transparent;
    }

    nav a.active {
      border-bottom-color: white;
    }

    img {
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 12px #0006;
      background: #222;
      max-width: 95vw;
    }

    input, button {
      margin-top: 20px;
      padding: 10px;
      font-size: 16px;
      background: rgba(0,0,0,0.5);
      color: white;
      border: 1px solid white;
      border-radius: 5px;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      text-shadow: 1px 1px 2px #000;
    }

    #guess-history {
      margin: 30px auto 0;
      max-width: 500px;
      background: rgba(0,0,0,0.4);
      padding: 20px;
      border-radius: 10px;
      text-align: left;
    }

    #guess-history h3 {
      margin-bottom: 10px;
    }

    #history-list {
      list-style: none;
      padding: 0;
    }

    #history-list li {
      margin-bottom: 5px;
      font-size: 16px;
    }

    .correct {
      color: lightgreen;
    }

    .wrong {
      color: salmon;
    }

    #play-again-btn {
      display: none;
      margin-top: 20px;
      background: rgba(0,128,0,0.5);
      border: 1px solid white;
      color: white;
      padding: 10px 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    #credit {
      position: fixed;
      right: 15px;
      bottom: 10px;
      font-size: 30px;
      text-shadow: 1px 1px 2px #000;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Main</a>
    <a href="mk8deluxe.html">Mario Kart 8 Deluxe</a>
    <a href="info.html">Update Plans</a>
    <a href="mkwd.html" class="active">Mario Kart World</a>
  </nav>

  <h1>Guess the Mario Kart World Track!</h1>
  <img id="track-img" src="images_mkwd/mkwd_0001.png" alt="Track Outline" width="300">

  <br><br>

  <input
    type="text"
    id="guess"
    placeholder="Enter your guess here..."
    list="track-list"
    autocomplete="on"
  >
  <datalist id="track-list"></datalist>

  <br><br>
  <button type="button" onclick="submitGuess()">Submit</button>
  <p id="result"></p>
  <button type="button" id="play-again-btn" onclick="resetGame()">🔁 Play Again</button>

  <div id="guess-history">
    <h3>Guesses:</h3>
    <ul id="history-list"></ul>
  </div>

  <div id="credit">By MRAP12</div>

  <script>
    // Deluxe track list
    const validTracks = [
      "Mario Bros Circuit", "Crown City", "Whistlestop Summit", "DK Spaceport",
      "Desert Hills", "Shy Guy Bazaar", "Wario Stadium", "Airship Fortress",
      "DK Pass", "Starview Peak", "Sky-High Sundae", "Wario Shipyard",
      "Koopa Troopa Beach", "Faraway Oasis", "Crown City", "Peach Stadium",
      "Peach Beach", "Salty Salty Speedway", "Dino Dino Jungle", "Great ? Block Ruins",
      "Cheep Cheep Falls", "Dandelion Depths", "Boo Cinema", "Dry Bones Burnout",
      "Moo Moo Meadows", "Choco Mountain", "Toad's Factory",
      "Bowser's Castle", "Acorn Heights", "Mario Circuit",
      "Peach Stadium", "Rainbow Road"
    ];

    // Track mapping by number
    const trackImages = [
      { name: "Mario Bros Circuit", img: "mkwd_0001.png" },
      { name: "Crown City", img: "mkwd_0002.png" },
      { name: "Whistlestop Summit", img: "mkwd_0003.png" },
      { name: "DK Spaceport", img: "mkwd_0004.png" },
      { name: "Desert Hills", img: "mkwd_0005.png" },
      { name: "Shy Guy Bazaar", img: "mkwd_0006.png" },
      { name: "Wario Stadium", img: "mkwd_0007.png" },
      { name: "Airship Fortress", img: "mkwd_0008.png" },
      { name: "DK Pass", img: "mkwd_0009.png" },
      { name: "Starview Peak", img: "mkwd_0010.png" },
      { name: "Sky-High Sundae", img: "mkwd_0011.png" },
      { name: "Wario Shipyard", img: "mkwd_0012.png" },
      { name: "Koopa Troopa Beach", img: "mkwd_0013.png" },
      { name: "Faraway Oasis", img: "mkwd_0014.png" },
      { name: "Crown City", img: "mkwd_0015.png" },
      { name: "Peach Stadium", img: "mkwd_0016.png" },
      { name: "Peach Beach", img: "mkwd_0017.png" },
      { name: "Salty Salty Speedway", img: "mkwd_0018.png" },
      { name: "Dino Dino Jungle", img: "mkwd_0019.png" },
      { name: "Great ? Block Ruins", img: "mkwd_0020.png" },
      { name: "Cheep Cheep Falls", img: "mkwd_0021.png" },
      { name: "Dandelion Depths", img: "mkwd_0022.png" },
      { name: "Boo Cinema", img: "mkwd_0023.png" },
      { name: "Dry Bones Burnout", img: "mkwd_0024.png" },
      { name: "Moo Moo Meadows", img: "mkwd_0025.png" },
      { name: "Choco Mountain", img: "mkwd_0026.png" },
      { name: "Toad's Factory", img: "mkwd_0027.png" },
      { name: "Bowser's Castle", img: "mkwd_0028.png" },
      { name: "Acorn Heights", img: "mkwd_0029.png" },
      { name: "Mario Circuit", img: "mkwd_0030.png" },
      { name: "Peach Stadium", img: "mkwd_0031.png" },
      { name: "Rainbow Road", img: "mkwd_0032.png" },
    ];

    let answerIndex = Math.floor(Math.random() * trackImages.length);
    let answer = trackImages[answerIndex].name;
    let guessCount = 0;
    const MAX_GUESSES = 6;
    const STORAGE_KEY = 'mkwdGuesses';

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('track-img').src = 'images_mkwd/' + trackImages[answerIndex].img;
      loadHistory();
      populateDatalist();
    });

    function populateDatalist() {
      const dl = document.getElementById('track-list');
      dl.innerHTML = '';
      validTracks.forEach(track => {
        const opt = document.createElement('option');
        opt.value = track;
        dl.appendChild(opt);
      });
    }

    function submitGuess() {
      if (guessCount >= MAX_GUESSES) {
        alert("❌ You've reached the maximum number of guesses!");
        return;
      }

      const input = document.getElementById('guess');
      const guess = input.value.trim();
      if (!validTracks.includes(guess)) {
        alert("❌ Invalid track name. Please choose a valid Mario Kart World track.");
        return;
      }

      const isCorrect = guess === answer;
      document.getElementById('result').innerText = isCorrect
        ? "✅ Correct! It's " + answer
        : "❌ Wrong guess. Try again!";

      guessCount++;
      addToHistory(guess, isCorrect);

      if (isCorrect || guessCount >= MAX_GUESSES) {
        document.getElementById('play-again-btn').style.display = 'inline-block';
      }

      input.value = '';
    }

    function addToHistory(guess, isCorrect) {
      const list = document.getElementById('history-list');
      const li = document.createElement('li');
      li.textContent = `Guess ${guessCount}: ${guess} ${isCorrect ? '✅' : '❌'}`;
      li.className = isCorrect ? 'correct' : 'wrong';
      list.appendChild(li);

      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      stored.push({ guess, correct: isCorrect, number: guessCount });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
    }

    function loadHistory() {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      stored.forEach(entry => {
        const li = document.createElement('li');
        li.textContent = `Guess ${entry.number}: ${entry.guess} ${entry.correct ? '✅' : '❌'}`;
        li.className = entry.correct ? 'correct' : 'wrong';
        list.appendChild(li);
      });
    }

    function resetGame() {
      answerIndex = Math.floor(Math.random() * trackImages.length);
      answer = trackImages[answerIndex].name;
      document.getElementById('track-img').src = 'images_mkwd/' + trackImages[answerIndex].img;
      guessCount = 0;
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('history-list').innerHTML = '';
      document.getElementById('result').innerText = '';
      document.getElementById('play-again-btn').style.display = 'none';
      document.getElementById('guess').value = '';
    }
  </script>
</body>
</html>
