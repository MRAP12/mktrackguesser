<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="images2/favicon.png">
  <title>MK8 Deluxe Track Guesser</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 40px;
      text-align: center;
      font-family: 'Lexend', sans-serif;
      color: white;
      background: url('images2/background.jpg') center/cover no-repeat;
    }

    h1 {
      text-shadow: 2px 2px 4px #000;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.6);
      padding: 15px 0;
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      padding-bottom: 5px;
      border-bottom: 2px solid transparent;
    }

    nav a.active {
      border-bottom-color: white;
    }

    img {
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 12px #0006;
      background: #222;
      max-width: 95vw;
    }

    input, button {
      margin-top: 20px;
      padding: 10px;
      font-size: 16px;
      background: rgba(0,0,0,0.5);
      color: white;
      border: 1px solid white;
      border-radius: 5px;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      text-shadow: 1px 1px 2px #000;
    }

    #guess-history {
      margin: 30px auto 0;
      max-width: 500px;
      background: rgba(0,0,0,0.4);
      padding: 20px;
      border-radius: 10px;
      text-align: left;
    }

    #guess-history h3 {
      margin-bottom: 10px;
    }

    #history-list {
      list-style: none;
      padding: 0;
    }

    #history-list li {
      margin-bottom: 5px;
      font-size: 16px;
    }

    .correct {
      color: lightgreen;
    }

    .wrong {
      color: salmon;
    }

    #play-again-btn {
      display: none;
      margin-top: 20px;
      background: rgba(0,128,0,0.5);
      border: 1px solid white;
      color: white;
      padding: 10px 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    #credit {
      position: fixed;
      right: 15px;
      bottom: 10px;
      font-size: 30px;
      text-shadow: 1px 1px 2px #000;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Main</a>
    <a href="mk8deluxe.html" class="active">Mario Kart 8 Deluxe</a>
    <a href="info.html">Update Plans</a>
  </nav>

  <h1>Guess the MK8 Deluxe Track!</h1>
  <img id="track-img" src="images2/mk8_0001.png" alt="Track Outline" width="300">

  <br><br>

  <input
    type="text"
    id="guess"
    placeholder="Enter your guess here..."
    list="track-list"
    autocomplete="on"
  >
  <datalist id="track-list"></datalist>

  <br><br>
  <button type="button" onclick="submitGuess()">Submit</button>
  <p id="result"></p>
  <button type="button" id="play-again-btn" onclick="resetGame()">🔁 Play Again</button>

  <div id="guess-history">
    <h3>Guesses:</h3>
    <ul id="history-list"></ul>
  </div>

  <div id="credit">By MRAP12</div>

  <script>
    // Deluxe track list
    const validTracks = [
      "Mario Kart Stadium", "Water Park", "Sweet Sweet Canyon", "Thwomp Ruins",
      "Mario Circuit", "Toad Harbour", "Twisted Mansion", "Shy Guy Falls",
      "Sunshine Airport", "Dolphin Shoals", "Electrodrome", "Mount Wario",
      "Cloudtop Cruise", "Bone Dry Dunes", "Bowser's Castle", "Rainbow Road",
      "GCN Yoshi Circuit", "Excitebike Arena", "Dragon Driftway", "Mute City",
      "GCN Baby Park", "GBA Cheese Land", "Wild Woods", "Animal Crossing",
      "Wii Moo Moo Meadows", "GBA Mario Circuit", "DS Cheep Cheep Beach",
      "N64 Toad's Turnpike", "GCN Dry Dry Desert", "SNES Donut Plains 3",
      "N64 Royal Raceway", "3DS DK Jungle", "DS Wario Stadium", "GCN Sherbet Land",
      "3DS Music Park", "N64 Yoshi Valley", "DS Tick-Tock Clock",
      "3DS Piranha Plant Pipeway", "Wii Grumble Volcano", "N64 Rainbow Road",
      "Wii Wario's Gold Mine", "SNES Rainbow Road", "Ice Ice Outpost",
      "Hyrule Circuit", "3DS Neo Koopa City", "GBA Ribbon Road",
      "Super Bell Subway", "Big Blue", "Tour Paris Promenade",
      "3DS Toad Circuit", "N64 Choco Mountain", "Wii Coconut Mall"
    ];

    // Track mapping by number
    const trackImages = [
      { name: "Mario Kart Stadium", img: "mk8_0001.png" },
      { name: "Water Park", img: "mk8_0002.png" },
      { name: "Sweet Sweet Canyon", img: "mk8_0003.png" },
      { name: "Thwomp Ruins", img: "mk8_0004.png" },
      { name: "Mario Circuit", img: "mk8_0005.png" },
      { name: "Toad Harbour", img: "mk8_0006.png" },
      { name: "Twisted Mansion", img: "mk8_0007.png" },
      { name: "Shy Guy Falls", img: "mk8_0008.png" },
      { name: "Sunshine Airport", img: "mk8_0009.png" },
      { name: "Dolphin Shoals", img: "mk8_0010.png" },
      { name: "Electrodrome", img: "mk8_0011.png" },
      { name: "Mount Wario", img: "mk8_0012.png" },
      { name: "Cloudtop Cruise", img: "mk8_0013.png" },
      { name: "Bone Dry Dunes", img: "mk8_0014.png" },
      { name: "Bowser's Castle", img: "mk8_0015.png" },
      { name: "Rainbow Road", img: "mk8_0016.png" },
      { name: "GCN Yoshi Circuit", img: "mk8_0017.png" },
      { name: "Excitebike Arena", img: "mk8_0018.png" },
      { name: "Dragon Driftway", img: "mk8_0019.png" },
      { name: "Mute City", img: "mk8_0020.png" },
      { name: "GCN Baby Park", img: "mk8_0021.png" },
      { name: "GBA Cheese Land", img: "mk8_0022.png" },
      { name: "Wild Woods", img: "mk8_0023.png" },
      { name: "Animal Crossing", img: "mk8_0024.png" },
      { name: "Wii Moo Moo Meadows", img: "mk8_0025.png" },
      { name: "GBA Mario Circuit", img: "mk8_0026.png" },
      { name: "DS Cheep Cheep Beach", img: "mk8_0027.png" },
      { name: "N64 Toad's Turnpike", img: "mk8_0028.png" },
      { name: "GCN Dry Dry Desert", img: "mk8_0029.png" },
      { name: "SNES Donut Plains 3", img: "mk8_0030.png" },
      { name: "N64 Royal Raceway", img: "mk8_0031.png" },
      { name: "3DS DK Jungle", img: "mk8_0032.png" },
      { name: "DS Wario Stadium", img: "mk8_0033.png" },
      { name: "GCN Sherbet Land", img: "mk8_0034.png" },
      { name: "3DS Music Park", img: "mk8_0035.png" },
      { name: "N64 Yoshi Valley", img: "mk8_0036.png" },
      { name: "DS Tick-Tock Clock", img: "mk8_0037.png" },
      { name: "3DS Piranha Plant Pipeway", img: "mk8_0038.png" },
      { name: "Wii Grumble Volcano", img: "mk8_0039.png" },
      { name: "N64 Rainbow Road", img: "mk8_0040.png" },
      { name: "Wii Wario's Gold Mine", img: "mk8_0041.png" },
      { name: "SNES Rainbow Road", img: "mk8_0042.png" },
      { name: "Ice Ice Outpost", img: "mk8_0043.png" },
      { name: "Hyrule Circuit", img: "mk8_0044.png" },
      { name: "3DS Neo Koopa City", img: "mk8_0045.png" },
      { name: "GBA Ribbon Road", img: "mk8_0046.png" },
      { name: "Super Bell Subway", img: "mk8_0047.png" },
      { name: "Big Blue", img: "mk8_0048.png" },
      { name: "Tour Paris Promenade", img: "mk8_0049.png" },
      { name: "3DS Toad Circuit", img: "mk8_0050.png" },
      { name: "N64 Choco Mountain", img: "mk8_0051.png" },
      { name: "Wii Coconut Mall", img: "mk8_0052.png" }
    ];

    let answerIndex = Math.floor(Math.random() * trackImages.length);
    let answer = trackImages[answerIndex].name;
    let guessCount = 0;
    const MAX_GUESSES = 6;
    const STORAGE_KEY = 'mk8dGuesses';

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('track-img').src = 'images2/' + trackImages[answerIndex].img;
      loadHistory();
      populateDatalist();
    });

    function populateDatalist() {
      const dl = document.getElementById('track-list');
      dl.innerHTML = '';
      validTracks.forEach(track => {
        const opt = document.createElement('option');
        opt.value = track;
        dl.appendChild(opt);
      });
    }

    function submitGuess() {
      if (guessCount >= MAX_GUESSES) {
        alert("❌ You've reached the maximum number of guesses!");
        return;
      }

      const input = document.getElementById('guess');
      const guess = input.value.trim();
      if (!validTracks.includes(guess)) {
        alert("❌ Invalid track name. Please choose a valid MK8 Deluxe track.");
        return;
      }

      const isCorrect = guess === answer;
      document.getElementById('result').innerText = isCorrect
        ? "✅ Correct! It's " + answer
        : "❌ Wrong guess. Try again!";

      guessCount++;
      addToHistory(guess, isCorrect);

      if (isCorrect || guessCount >= MAX_GUESSES) {
        document.getElementById('play-again-btn').style.display = 'inline-block';
      }

      input.value = '';
    }

    function addToHistory(guess, isCorrect) {
      const list = document.getElementById('history-list');
      const li = document.createElement('li');
      li.textContent = `Guess ${guessCount}: ${guess} ${isCorrect ? '✅' : '❌'}`;
      li.className = isCorrect ? 'correct' : 'wrong';
      list.appendChild(li);

      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      stored.push({ guess, correct: isCorrect, number: guessCount });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
    }

    function loadHistory() {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      stored.forEach(entry => {
        const li = document.createElement('li');
        li.textContent = `Guess ${entry.number}: ${entry.guess} ${entry.correct ? '✅' : '❌'}`;
        li.className = entry.correct ? 'correct' : 'wrong';
        list.appendChild(li);
      });
    }

    function resetGame() {
      answerIndex = Math.floor(Math.random() * trackImages.length);
      answer = trackImages[answerIndex].name;
      document.getElementById('track-img').src = 'images2/' + trackImages[answerIndex].img;
      guessCount = 0;
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('history-list').innerHTML = '';
      document.getElementById('result').innerText = '';
      document.getElementById('play-again-btn').style.display = 'none';
      document.getElementById('guess').value = '';
    }
  </script>
</body>
</html>
