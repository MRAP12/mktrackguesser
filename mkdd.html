<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guess the Mario Kart: Double Dash track!</title>
  <link rel="icon" type="image/png" href="images_mkdd/favicon_mkdd.png" />
  <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gap-xs: 0.5rem;
      --gap: 1rem;
      --gap-lg: 1.5rem;
      --panel: rgba(0,0,0,0.45);
      --overlay: rgba(0,0,0,0.6);
      --shadow: #0006;
      --text: #fff;
      --radius: 12px;
      --tap: 44px;
    }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 1rem 1rem 5rem;
      color: var(--text);
      font-family: 'Lexend', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align: center;
      background: url('images_mkdd/background_mkdd.png') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.65));
      pointer-events: none;
      z-index: -1;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--overlay);
      backdrop-filter: blur(6px) saturate(120%);
      -webkit-backdrop-filter: blur(6px) saturate(120%);
      border-radius: 999px;
      margin-inline: auto;
      margin-top: 0.25rem;
      padding: 0.6rem 1rem;
      max-width: min(100%, 1000px);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      line-height: 1;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      text-shadow: 1px 1px 2px #000;
      padding-bottom: 0.25rem;
      border-bottom: 2px solid transparent;
      outline-offset: 4px;
    }

    nav a.active,
    nav a:focus-visible,
    nav a:hover {
      border-bottom-color: var(--text);
    }

    main {
      width: 100%;
      max-width: 1000px;
      margin-inline: auto;
      display: grid;
      place-items: center;
      gap: var(--gap-lg);
      flex: 1;
    }

    h1 {
      margin: 0.5rem 0 0;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      line-height: 1.15;
      text-shadow: 2px 2px 4px #000;
    }

    .card {
      width: min(100%, 720px);
      background: var(--panel);
      padding: var(--gap-lg);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px var(--shadow);
      display: grid;
      gap: var(--gap);
      justify-items: center;
    }

    #track-img {
      display: block;
      width: 100%;
      max-width: 520px;
      height: auto;
      margin-inline: auto;
      border-radius: 10px;
      box-shadow: 0 2px 12px var(--shadow);
      background: #222;
    }

    /* Fix input row centering and alignment */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }

    .controls-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    label.sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    input[type="text"], button {
      background: rgba(0,0,0,0.5);
      color: var(--text);
      border: 1px solid #fff;
      border-radius: 8px;
      font-size: 1rem;
      min-height: var(--tap);
      box-sizing: border-box;
    }

    input[type="text"] {
      padding: 0.75rem 0.85rem;
      width: 100%;
      max-width: 360px;
      flex: 1 1 0;
      text-align: left;
      margin: 0;
    }

    button {
      cursor: pointer;
      padding: 0.75rem 1rem;
      white-space: nowrap;
      margin: 0;
      flex-shrink: 0;
    }

    #submit-btn {
      background: rgba(0, 128, 255, 0.5);
      border-color: #e6f3ff;
    }

    #play-again-btn {
      display: none;
      background: rgba(0, 128, 0, 0.5);
      border-color: #eaffea;
    }

    #result {
      min-height: 1.6em;
      font-size: 1.05rem;
      text-shadow: 1px 1px 2px #000;
    }

    .history {
      width: min(100%, 720px);
      background: var(--panel);
      padding: var(--gap-lg);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px var(--shadow);
      text-align: left;
    }

    .history h3 {
      margin: 0 0 var(--gap);
      font-size: 1.1rem;
    }

    #history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.35rem;
    }

    #history-list li { font-size: 1rem; }
    .correct { color: lightgreen; }
    .wrong { color: salmon; }

    #credit {
      position: fixed;
      right: 10px;
      bottom: 10px;
      font-size: clamp(1rem, 3.2vw, 1.4rem);
      text-shadow: 1px 1px 2px #000;
      user-select: none;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      header { border-radius: 14px; }
      nav { gap: 0.75rem; }
      .controls-row {
        flex-direction: column;
        align-items: stretch;
        max-width: 100%;
      }
      input[type="text"] {
        max-width: 100%;
      }
      #credit {
        position: static;
        pointer-events: auto;
        margin-top: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      body::before { background: rgba(0,0,0,0.5); }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Primary">
      <a href="index.html">Main</a>
      <a href="mkdd.html" class="active" aria-current="page">Mario Kart: Double Dash</a>
      <a href="mk8deluxe.html">Mario Kart 8 Deluxe</a>
      <a href="mkwd.html" >Mario Kart World</a>      
      <a href="info.html">Update Plans</a>
    </nav>
  </header>

  <main>
    <h1>Guess the Mario Kart: Double Dash Track!</h1>
    <section class="card" aria-labelledby="game-title">
      <img id="track-img" src="images_mkdd/mkdd_0001.png" alt="Track outline to guess" />
      <div class="controls" id="controls">
        <form class="controls-row" id="input-row" autocomplete="off" onsubmit="return false;">
          <label class="sr-only" for="guess">Track name</label>
          <input
            type="text"
            id="guess"
            placeholder="Enter your guess..."
            list="track-list"
            autocomplete="on"
            inputmode="text"
          />
          <button id="submit-btn" type="button">Submit</button>
        </form>
        <datalist id="track-list"></datalist>
        <p id="result" role="status" aria-live="polite"></p>
        <button type="button" id="play-again-btn">🔁 Play Again</button>
      </div>
    </section>

    <section class="history" aria-labelledby="history-title">
      <h3 id="history-title">Guesses</h3>
      <ul id="history-list"></ul>
    </section>
  </main>

  <div id="credit">By MRAP12</div>

  <script>
    const trackImages = [
      { name: "Luigi Circuit", img: "mkdd_0001.png" },
      { name: "Peach Beach", img: "mkdd_0002.png" },
      { name: "Baby Park", img: "mkdd_0003.png" },
      { name: "Dry Dry Desert", img: "mkdd_0004.png" },
      { name: "Mushroom Bridge", img: "mkdd_0005.png" },
      { name: "Mario Circuit", img: "mkdd_0006.png" },
      { name: "Daisy Cruiser", img: "mkdd_0007.png" },
      { name: "Waluigi Stadium", img: "mkdd_0008.png" },
      { name: "Sherbet Land", img: "mkdd_0009.png" },
      { name: "Mushroom City", img: "mkdd_0010.png" },
      { name: "Yoshi Circuit", img: "mkdd_0011.png" },
      { name: "DK Mountain", img: "mkdd_0012.png" },
      { name: "Wario Colosseum", img: "mkdd_0013.png" },
      { name: "Dino Dino Jungle", img: "mkdd_0014.png" },
      { name: "Bowser's Castle", img: "mkdd_0015.png" },
      { name: "Rainbow Road", img: "mkdd_0016.png" },
      { name: "Cookie Land", img: "mkdd_0017.png" },
      { name: "Block City", img: "mkdd_0018.png" },
      { name: "Luigi's Mansion", img: "mkdd_0019.png" },
      { name: "Nintendo GameCube", img: "mkdd_0020.png" },
      { name: "Pipe Plaza", img: "mkdd_0021.png" },
      { name: "Tilt-a-Kart", img: "mkdd_0022.png" }
    ];

    const validTracks = Array.from(new Set(trackImages.map(t => t.name)));
    let answerIndex = Math.floor(Math.random() * trackImages.length);
    let answer = trackImages[answerIndex].name;
    let guessCount = 0;
    const MAX_GUESSES = 6;
    const STORAGE_KEY = 'mkddGuesses';
    let previousGuesses = [];

    const imgEl = document.getElementById('track-img');
    const guessEl = document.getElementById('guess');
    const resultEl = document.getElementById('result');
    const historyListEl = document.getElementById('history-list');
    const submitBtn = document.getElementById('submit-btn');
    const playAgainBtn = document.getElementById('play-again-btn');
    const inputRow = document.getElementById('input-row');

    document.addEventListener('DOMContentLoaded', () => {
      imgEl.src = 'images_mkdd/' + trackImages[answerIndex].img;
      populateDatalist();
      loadHistory();
      wireEvents();
      guessEl.focus();
    });

    function wireEvents() {
      submitBtn.addEventListener('click', submitGuess);
      playAgainBtn.addEventListener('click', resetGame);
      guessEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitGuess();
        }
      });
    }

    function populateDatalist() {
      const dl = document.getElementById('track-list');
      dl.innerHTML = '';
      validTracks.forEach(track => {
        const opt = document.createElement('option');
        opt.value = track;
        dl.appendChild(opt);
      });
    }

    function submitGuess() {
      if (submitBtn.disabled) return;

      const raw = guessEl.value.trim();
      const guess = raw;
      const normalized = raw.toLowerCase();

      if (!validTracks.map(n => n.toLowerCase()).includes(normalized)) {
        alert("❌ Invalid track name. Please choose a valid Mario Kart: Double Dash track.");
        return;
      }

      if (previousGuesses.includes(normalized)) {
        alert("⚠️ You've already guessed that track.");
        return;
      }

      const isCorrect = guess === answer;
      guessCount++;
      previousGuesses.push(normalized);

      resultEl.textContent = isCorrect
        ? `✅ Correct! It's ${answer}`
        : `❌ Wrong guess. Try again! (${MAX_GUESSES - guessCount} left)`;

      addToHistory(guess, isCorrect);

      if (isCorrect || guessCount >= MAX_GUESSES) {
        endGame(isCorrect);
      }

      guessEl.value = '';
      if (!isCorrect) guessEl.focus();
    }

    function addToHistory(guess, isCorrect) {
      const li = document.createElement('li');
      li.textContent = `Guess ${guessCount}: ${guess} ${isCorrect ? '✅' : '❌'}`;
      li.className = isCorrect ? 'correct' : 'wrong';
      historyListEl.appendChild(li);

      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      stored.push({ guess, correct: isCorrect, number: guessCount });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
    }

    function loadHistory() {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      historyListEl.innerHTML = '';
      stored.forEach(entry => {
        const li = document.createElement('li');
        li.textContent = `Guess ${entry.number}: ${entry.guess} ${entry.correct ? '✅' : '❌'}`;
        li.className = entry.correct ? 'correct' : 'wrong';
        historyListEl.appendChild(li);
      });
      guessCount = stored.length;
      previousGuesses = stored.map(e => e.guess.toLowerCase());

      if (stored.some(e => e.correct) || guessCount >= MAX_GUESSES) {
        endGame(stored.some(e => e.correct), { fromLoad: true });
      }
    }

    function endGame(won, opts = {}) {
      if (!won) {
        resultEl.textContent = `❌ Out of guesses! The answer was: ${answer}`;
      }

      submitBtn.disabled = true;
      guessEl.disabled = true;
      inputRow.style.display = 'none';

      playAgainBtn.style.display = 'inline-block';
      document.body.style.paddingBottom = '5.5rem';

      if (!opts.fromLoad) {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
      }
    }

    function resetGame() {
      answerIndex = Math.floor(Math.random() * trackImages.length);
      answer = trackImages[answerIndex].name;
      imgEl.src = 'images_mkdd/' + trackImages[answerIndex].img;

      guessCount = 0;
      previousGuesses = [];
      resultEl.textContent = '';
      historyListEl.innerHTML = '';
      guessEl.value = '';
      guessEl.disabled = false;
      submitBtn.disabled = false;
      inputRow.style.display = 'flex';
      playAgainBtn.style.display = 'none';

      localStorage.removeItem(STORAGE_KEY);
      document.body.style.paddingBottom = '5rem';

      guessEl.focus();
    }
  </script>
</body>
</html>
