      margin: 0;

      margin-bottom: 10px;
      text-shadow: 1px 1px 2px #000;
    }

    #update-content {
      white-space: pre-wrap;
      font-size: 20px;
    }

      position: fixed;
      right: 15px;
      bottom: 10px;
      font-size: 30px;
      text-shadow: 1px 1px 2px #000;
    }
    .plan-img {
      margin: 20px auto 0;
